name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip CineStream-Android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate Gradle wrapper
        run: gradle wrapper
        working-directory: CineStream
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: CineStream
      - uses: actions/upload-artifact@v4
        with:
          name: cinestream-apk
          path: CineStream/app/build/outputs/apk/debug/app-debug.apk
